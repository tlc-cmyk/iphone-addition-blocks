<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="加數積木星星" />
  <meta name="theme-color" content="#1a0a4e" />
  <meta name="description" content="數字積木加法遊戲 — 專為 iPhone 設計的兒童加法練習" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>加數積木星星 · 數字積木加法</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="home-hero">
        <div class="logo-blocks" id="logo-blocks" aria-hidden="true"></div>
        <h1 class="title">加數積木星星</h1>
        <p class="subtitle">數字積木 · 快樂學加法</p>
      </div>
      <div class="home-mute-row">
        <button type="button" class="mute-btn" id="btn-mute-home" aria-pressed="false" aria-label="靜音" title="靜音">
          <span class="mute-icon" aria-hidden="true">🔊</span>
          <span class="mute-label">開聲</span>
        </button>
      </div>

      <div class="home-mode-row">
        <button type="button" class="learn-entry-btn" id="btn-learn-zone">
          <span class="learn-entry-emoji">📚</span>
          <span class="learn-entry-text">
            <strong>學習區</strong>
            <small>6 課引導 · 由淺入深</small>
          </span>
          <span class="learn-entry-arrow">›</span>
        </button>
      </div>

      <p class="pick-label">自由練習 · 揀難度</p>
      <div class="diff-list">
        <button type="button" class="diff-btn easy" data-diff="easy">
          <span class="diff-emoji">🌱</span>
          <span class="diff-text">
            <strong>易</strong>
            <small>1–10 · 湊十 · 大大積木</small>
          </span>
          <span class="diff-q">20 題</span>
        </button>
        <button type="button" class="diff-btn mid" data-diff="mid">
          <span class="diff-emoji">⭐</span>
          <span class="diff-text">
            <strong>中</strong>
            <small>1–20 · 缺數 · 輕組合</small>
          </span>
          <span class="diff-q">20 題</span>
        </button>
        <button type="button" class="diff-btn hard" data-diff="hard">
          <span class="diff-emoji">🚀</span>
          <span class="diff-text">
            <strong>難</strong>
            <small>連加 · 缺數 · 組合數式</small>
          </span>
          <span class="diff-q">20 題</span>
        </button>
      </div>
      <p class="home-foot">專為 iPhone 設計 · 可加入主畫面</p>
    </section>

    <!-- LEARN MAP -->
    <section id="screen-learn-map" class="screen">
      <header class="play-bar">
        <button type="button" id="btn-map-back" class="icon-btn" aria-label="返回">✕</button>
        <div class="map-title-wrap">
          <h2 class="map-title">學習區</h2>
          <p class="map-sub">一課一課學，完成就解鎖下一課</p>
        </div>
        <button type="button" class="mute-btn mute-btn-icon" id="btn-mute-map" aria-pressed="false" aria-label="靜音" title="靜音">
          <span class="mute-icon" aria-hidden="true">🔊</span>
        </button>
      </header>
      <div class="lesson-map" id="lesson-map" role="list"></div>
    </section>

    <!-- TEACH -->
    <section id="screen-teach" class="screen">
      <header class="play-bar">
        <button type="button" id="btn-teach-back" class="icon-btn" aria-label="返回地圖">‹</button>
        <div class="map-title-wrap">
          <h2 class="map-title" id="teach-lesson-title">認識數字</h2>
          <p class="map-sub" id="teach-step-label">第 1 步</p>
        </div>
        <button type="button" class="mute-btn mute-btn-icon" id="btn-mute-teach" aria-pressed="false" aria-label="靜音" title="靜音">
          <span class="mute-icon" aria-hidden="true">🔊</span>
        </button>
      </header>
      <div class="teach-card" id="teach-card">
        <div class="teach-viz" id="teach-viz" aria-hidden="true"></div>
        <p class="teach-headline" id="teach-headline"></p>
        <p class="teach-body" id="teach-body"></p>
      </div>
      <div class="teach-dots" id="teach-dots" aria-hidden="true"></div>
      <div class="teach-actions">
        <button type="button" id="btn-teach-next" class="primary-btn">下一步</button>
      </div>
    </section>

    <!-- PLAY -->
    <section id="screen-play" class="screen">
      <header class="play-bar">
        <button type="button" id="btn-quit" class="icon-btn" aria-label="返回">✕</button>
        <div class="progress-wrap">
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text">1 / 12</span>
        </div>
        <div class="star-chip" aria-live="polite">
          <span class="star-icon">★</span>
          <span id="star-count">0</span>
        </div>
        <button type="button" class="mute-btn mute-btn-icon" id="btn-mute-play" aria-pressed="false" aria-label="靜音" title="靜音">
          <span class="mute-icon" aria-hidden="true">🔊</span>
        </button>
      </header>
      <div class="type-badge" id="type-badge">簡單加法</div>
      <div class="question-card">
        <div id="block-viz" class="block-viz" aria-hidden="true"></div>
        <p id="question-text" class="question-text"></p>
      </div>
      <div id="choices" class="choices" role="group" aria-label="答案選項"></div>
      <div id="feedback" class="feedback" hidden></div>
    </section>

    <!-- END -->
    <section id="screen-end" class="screen">
      <div class="end-hero">
        <div id="end-blocks" class="end-blocks" aria-hidden="true"></div>
        <h2 id="end-title">做得好！</h2>
        <p id="end-msg" class="end-msg"></p>
        <div class="end-stars" id="end-stars"></div>
        <p class="end-score"><span id="end-correct">0</span> / <span id="end-total">12</span> 題答對</p>
      </div>
      <div class="end-actions">
        <button type="button" id="btn-again" class="primary-btn">再玩一次</button>
        <button type="button" id="btn-home" class="secondary-btn">換難度</button>
      </div>
    </section>

    <!-- celebration overlay -->
    <div id="celebrate" class="celebrate" hidden aria-hidden="true"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
